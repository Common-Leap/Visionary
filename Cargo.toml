[package]
name = "visionary"
version = "0.4.0"
edition = "2021"
description = "A desktop editor for Super Smash Bros. Ultimate fighter data"

[[bin]]
name = "visionary"
path = "src/main.rs"

[dependencies]
# GUI + rendering
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "clipboard", "links"] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui-wgpu = "0.37.0"
egui_extras = { version = "0.37.0", features = ["all_loaders"] }
wgpu = "30.0.2"
glam = "0.34.3"

# SSBU file formats
# Character rendering.
# Common-Leap's fork (ScanMountGoat's renderer plus the depth view and scene hook the effect
# preview draws with, c7ccdb4) plus ModelFolder::load_files (costumes that share files
# through ARCropolis config.json) and apply_anims_with_skel_edit (fighter scale at the root).
ssbh_wgpu = { git = "https://github.com/Common-Leap/ssbh_wgpu", rev = "e3a603f0b7c3fe2a10a2077cf4e27f75a3c8f7f0" }
# The same ssbh_data ssbh_wgpu builds against, so their types are one and the same.
ssbh_data = { git = "https://github.com/ultimate-research/ssbh_lib", rev = "c1149c2", features = ["serde"] }
prc = { package = "prc-rs", version = "1.6" }
motion_lib = { package = "motion_list_rs", version = "1.5" }
serde_yaml = "0.9"
# The same nutexb ssbh_wgpu builds against.
nutexb = { git = "https://github.com/jam1garner/nutexb", rev = "7db7c08", features = ["ddsfile"] }
hash40 = "1.3"
# `.eff` parsing, editing, and export. 1.1.4 also preserves NONE child offsets for empty
# emitter sets, while retaining the BFRES and BNSH relocation-table fixes.
effect_library = "1.1.4"
eff_wgpu = { git = "https://github.com/Common-Leap/eff_wgpu", rev = "f400c6c41a6dc3084a638b47641f9def2de42633" }
# BNTX encode/decode, for importing your own PNG over an effect texture. Not published on
# crates.io, so pin the upstream commit. `image_dds` does the BCn compression and must stay
# on the same 0.7 line bntx builds against or the `Surface` types will not unify.
bntx = { git = "https://github.com/ScanMountGoat/bntx.git", rev = "87fffc7d17238cb07ff93ec75e0a7b5db15f4683" }
binrw = "0.15"
image_dds = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }

# Async + HTTP (for ACMD fetch)
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }

# Utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
anyhow = "1"
rfd = "0.18"
dirs = "7"
tempfile = "3"
fs2 = "0.4"
# Parse the caller-selected plugin manifest structurally. A substring check can
# be satisfied by a comment and is not sufficient for the generated ACMD ABI.
toml = "1"
# Parses the Rust that Visionary generates, so an export that would not compile is caught
# before it reaches disk rather than by the user's toolchain. Already in the dependency graph
# for the host, so this only pulls in the `full` item grammar.
syn = { version = "3", features = ["full", "visit"] }
# Not used directly — `syn` reports where a parse failed only when proc-macro2 is built with
# span locations, and "line 41, column 8" is the whole value of that report.
proc-macro2 = { version = "1", features = ["span-locations"] }
# Mod import. Compiled Smash mods are distributed as archives far more often than as loose
# folders, and asking a user to extract by hand is the step where the wrong nesting level ends
# up as the mod root. Deflate and bzip2 cover what real .zip mods use; the default feature set
# additionally pulls in encryption and several codecs no mod archive contains.
zip = { version = "9.6.1", default-features = false, features = ["deflate", "bzip2"] }
# The other half of that: GameBanana serves .7z at least as often as .zip.
sevenz-rust2 = "0.25.0"

# These native window systems only exist on Linux. Keeping them out of the common eframe
# declaration prevents Windows builds from inheriting host features they cannot use.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wayland", "x11", "wgpu", "default_fonts", "clipboard", "links"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland"] }
wayland-client = { version = "0.31.14", features = ["system"] }
wayland-protocols = { version = "0.32.12", features = ["client", "staging"] }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
# The shader compiler wgpu already builds, to check the preview's own WGSL in tests.
naga = { version = "30.0.2", features = ["wgsl-in"] }

[package.metadata.winresource]
OriginalFilename = "visionary.exe"
ProductName = "Visionary"
FileDescription = "Visionary"

# Optimize dependencies in debug builds — wgpu/ssbh_wgpu are unusably slow unoptimized
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
